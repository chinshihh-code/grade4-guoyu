<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四上國語字詞闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面想法：柔和的粉彩文具感——圓角白卡、淡淡陰影、粉圓字體 */
  --ink:#4b4a6b; --ink2:#8583a3; --bg:#f8f4fc; --card:#ffffff; --line:#ebe5f5; --edge:#e7e0f4;
  --blue:#6f82ee; --blue-soft:#e8ebff; --coral:#ffa6b6; --coral-soft:#ffecef;
  --sun:#ffdc85; --sun-soft:#fff7e0; --mint:#56c8a7; --mint-soft:#e2f7ef; --bad:#f07a8a;
  --mint-ink:#1c8f72; --bad-ink:#d04a60;
  --soft:0 6px 18px rgba(123,110,170,.13); --press:0 3px 0 rgba(123,110,170,.16),0 6px 16px rgba(123,110,170,.12);
  --display:"BiauKai","DFKai-SB","標楷體","TW-Kai","Kaiti TC","LXGW WenKai TC","PingFang TC",serif;
  --body:"BiauKai","DFKai-SB","標楷體","TW-Kai","Kaiti TC","LXGW WenKai TC","PingFang TC",serif;
  --kai:"BiauKai","DFKai-SB","標楷體","TW-Kai","Kaiti TC","LXGW WenKai TC","PingFang TC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 8% 4%,#ffeef2 0,transparent 32%),radial-gradient(circle at 96% 12%,#e6f7f1 0,transparent 30%),radial-gradient(circle at 60% 100%,#fff5d9 0,transparent 36%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#shell{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--coral);color:#fff;border:1.5px solid var(--edge);box-shadow:var(--soft);font-family:var(--kai);font-size:24px}
.pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--edge);border-radius:999px;padding:3px 12px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.pill b{color:var(--coral)} .pill.star b{color:#e0a100}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:8px 20px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1.5px solid var(--edge)}
nav.tabs button{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--ink2);padding:2px}
nav.tabs button i{font-style:normal;font-family:var(--kai);font-size:22px;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:2px solid transparent;color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on i{background:var(--sun);border-color:var(--ink);box-shadow:var(--soft)}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px;margin:26px 0 12px} h3{font-size:17px}
p{margin:0}
.card{background:var(--card);border:1.5px solid var(--edge);border-radius:18px;box-shadow:var(--soft);padding:18px}
.muted{color:var(--ink2);font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:14px;border:1.5px solid var(--edge);background:var(--card);font-weight:700;font-size:18px;box-shadow:var(--soft);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.pri{background:var(--blue);color:#fff} .btn.hot{background:var(--coral);color:#fff} .btn.sun{background:var(--sun)}
.btn.sm{min-height:42px;font-size:16px;padding:6px 14px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--edge);background:var(--card);font-weight:700;font-size:16px}
.chip.on{background:var(--blue);color:#fff;box-shadow:var(--soft)}
.chip small{font-weight:400;opacity:.85;margin-left:4px}
.seg{display:inline-flex;border:1.5px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:9px 20px;font-weight:700;min-height:46px}
.seg button+button{border-left:1.5px solid var(--edge)}
.seg button.on{background:var(--sun)}
/* 首頁 */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:stretch}
.hero .rank{background:var(--blue);color:#fff}
.rank .title{font-family:var(--kai);font-size:44px;line-height:1.1;margin:6px 0 10px}
.lvbar{height:14px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden;border:2px solid #fff}
.lvbar i{display:block;height:100%;background:var(--sun)}
.today b{font-size:38px;font-family:var(--display);font-variant-numeric:tabular-nums}
.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;justify-content:flex-end}
.tile i{font-style:normal;font-family:var(--kai);font-size:34px;line-height:1}
.tile b{font-size:19px;font-family:var(--display)} .tile span{font-size:14px;opacity:.9}
.t1{background:var(--coral);color:#fff}.t2{background:var(--sun)}.t3{background:var(--mint-soft)}.t4{background:var(--coral-soft)}
.lessons{grid-template-columns:repeat(4,1fr)}
.lesson{text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--edge);background:var(--card);display:flex;flex-direction:column;gap:6px}
.lesson small{color:var(--ink2);font-weight:700} .lesson b{font-size:16px;line-height:1.3;min-height:2.6em}
.meter{height:10px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:999px}
.meter.warn i{background:var(--sun)} .meter.low i{background:var(--coral)}
.badges{display:flex;gap:14px;flex-wrap:wrap}
.badge{width:92px;text-align:center;font-size:13px;color:var(--ink2);font-weight:700}
.badge i{font-style:normal;display:grid;place-items:center;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;border:3px double var(--line);color:var(--line);font-family:var(--kai);font-size:24px;line-height:1.05;background:var(--card);transform:rotate(-8deg)}
.badge.got{color:var(--ink)} .badge.got i{border-color:var(--bad);color:var(--bad);background:#fff5f4}
/* 練習設定 */
.unit{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.unit>span{flex:0 0 100%;font-size:14px;font-weight:700;color:var(--ink2)}
/* 作答 */
.qtop{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.qbar{flex:1;height:14px;border:1.5px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--sun)}
.qcount{font-weight:700;font-variant-numeric:tabular-nums}
.qcard{padding:22px;min-height:440px;display:flex;flex-direction:column;gap:16px}
.qtype{align-self:flex-start;background:var(--ink);color:#fff;border-radius:8px;padding:2px 12px;font-size:14px;font-weight:700}
.qword{font-family:var(--kai);font-size:64px;line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.qword.long{font-size:46px}
.qword em{font-style:normal;color:var(--coral);border-bottom:5px solid var(--coral)}
.qword .zy{font-family:var(--body);font-size:.5em;color:var(--blue);border:2px dashed var(--blue);border-radius:10px;padding:2px 8px;margin:0 4px;vertical-align:middle;white-space:nowrap}
.qword .bk{display:inline-block;width:1em;height:1em;border:3px dashed var(--coral);border-radius:10px;vertical-align:-.12em;margin:0 3px}
.qask{text-align:center;font-weight:700;font-size:19px}
.qsent{font-size:24px;line-height:1.8;font-family:var(--kai)}
.qsent u{text-decoration:none;display:inline-block;min-width:4.5em;border-bottom:3px solid var(--coral);margin:0 4px}
.qhint{background:var(--sun-soft);border-radius:12px;padding:8px 14px;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.opts.one{grid-template-columns:1fr}
.opt{min-height:64px;border:1.5px solid var(--edge);border-radius:14px;background:var(--card);font-size:26px;font-weight:700;padding:10px 14px;box-shadow:var(--soft)}
.opt.txt{font-size:17px;font-weight:400;text-align:left;line-height:1.5}
.opt.han{font-family:var(--kai);font-size:38px} .opt.wd{font-family:var(--kai);font-size:26px}
.opt.on{background:var(--blue);color:#fff;border-color:var(--blue);transform:scale(.98)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.pad{align-self:center;position:relative;width:min(300px,70vw);aspect-ratio:1;border:2px solid #d9cfee;border-radius:18px;background:#fff;
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),#f1b8b3 calc(50% - 1px),#f1b8b3 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(transparent calc(50% - 1px),#f1b8b3 calc(50% - 1px),#f1b8b3 calc(50% + 1px),transparent calc(50% + 1px))}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:9px}
.confirm{background:var(--sun-soft);border:1.5px solid var(--edge);border-radius:14px;padding:12px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:700}
/* 對照、成績 */
.checks{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.chk{display:flex;flex-direction:column;gap:10px;padding:14px}
.chk .pair{display:flex;gap:10px;align-items:center;justify-content:center}
.chk .mine,.chk .right{width:104px;height:104px;border:1.5px solid var(--edge);border-radius:10px;background:#fff;display:grid;place-items:center}
.chk .mine img{width:100%;height:100%}
.chk .right{font-family:var(--kai);font-size:76px;line-height:1;background:var(--mint-soft)}
.chk .mk{display:flex;gap:8px}
.chk .mk button{flex:1}
.btn.ok.on{background:var(--mint);color:#fff}.btn.no.on{background:var(--bad);color:#fff}
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--edge);box-shadow:var(--soft)}
.ring div{width:112px;height:112px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-size:38px;font-weight:700;border:1.5px solid var(--edge);font-variant-numeric:tabular-nums}
.gain{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.rv{border-top:2px dashed var(--line);padding:14px 0;display:grid;grid-template-columns:36px 1fr;gap:10px}
.rv:first-child{border-top:0}
.rv .mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:var(--mint)}
.rv.x .mark{background:var(--bad)}
.rv .q{font-family:var(--kai);font-size:21px;line-height:1.5}
.rv .a{font-size:16px} .rv .a s{color:var(--bad)} .rv .a b{color:var(--mint)}
.rv .e{font-size:15px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:6px}
.rv .e b{color:var(--ink)}
.rv img{width:64px;height:64px;border:1.5px solid var(--edge);border-radius:8px;background:#fff;vertical-align:middle}
/* 字卡 */
.scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.scroll .chip{flex:0 0 auto}
.flash{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;width:100%}
.flash .big{font-family:var(--kai);font-size:150px;line-height:1.05}
.flash .bigw{font-family:var(--kai);font-size:64px;line-height:1.2}
.flash .zyb{font-size:28px;color:var(--blue);font-weight:700}
.flash dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:18px;max-width:640px}
.flash dt{font-weight:700;color:var(--ink2);white-space:nowrap} .flash dd{margin:0}
.flash .tap{font-size:14px;color:var(--ink2)}
.kai{font-family:var(--kai);font-size:1.15em}
/* 錯題本、家長 */
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-top:2px dashed var(--line);align-items:center}
.mrow:first-child{border-top:0}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:8px;padding:1px 9px;background:var(--blue-soft);margin-right:6px}
.tag.red{background:var(--coral-soft);color:#b3261e}
.stats{grid-template-columns:repeat(4,1fr)}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th,.tbl td{padding:9px 8px;border-bottom:2px dashed var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:14px;color:var(--ink2)} .tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
/* 列印 */
.pages{display:grid;gap:18px;justify-items:center;margin-top:18px}
.pages img{width:100%;max-width:794px;border:1.5px solid var(--edge);box-shadow:var(--soft);background:#fff}
.note{background:var(--sun-soft);border:1.5px solid var(--edge);border-radius:14px;padding:10px 16px;font-size:15px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}.tiles,.lessons,.stats{grid-template-columns:repeat(2,1fr)}
  .opts{grid-template-columns:1fr}.qword{font-size:48px}.qword.long{font-size:34px}.score{grid-template-columns:1fr;justify-items:center;text-align:center}
  .flash .big{font-size:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 柔和版調整 */
.card{border-radius:26px}
.btn,.opt{box-shadow:var(--press);border-radius:18px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.hot{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.btn.sun{background:var(--sun);border-color:var(--sun)}
.chip{box-shadow:0 2px 0 rgba(123,110,170,.1)}
.chip.on{background:var(--blue);border-color:var(--blue);box-shadow:var(--soft)}
.seg{border-radius:18px}.seg button.on{background:var(--sun)}
.brand i{border:0;border-radius:14px;background:var(--coral);color:#fff;box-shadow:var(--soft)}
.pill{border-color:var(--edge);box-shadow:0 2px 0 rgba(123,110,170,.08)}
.pill b{color:var(--bad-ink)}.pill.star b{color:#e2a400}
nav.tabs{border-top:0;box-shadow:0 -6px 20px rgba(123,110,170,.12);border-radius:26px 26px 0 0}
nav.tabs button i{border-radius:50%}
nav.tabs button.on i{background:var(--sun);border-color:transparent;box-shadow:var(--soft)}
.hero .rank{background:linear-gradient(135deg,#8a9af5,#a99bf0);border:0}
.lvbar{border:0;background:rgba(255,255,255,.35)}
.t1{background:var(--coral-soft);color:var(--ink)}.t2{background:var(--sun-soft)}.t3{background:var(--mint-soft)}.t4{background:var(--blue-soft)}
.tile{border:0}.tile i{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;margin-bottom:6px;box-shadow:0 2px 0 rgba(123,110,170,.1)}
.lesson{border-radius:20px;box-shadow:0 2px 0 rgba(123,110,170,.1)}
.meter{height:12px}
.badge i{border-color:#ddd5ee;color:#cfc6e4}
.badge.got i{border-color:var(--bad);color:var(--bad-ink);background:var(--coral-soft)}
.qtype{background:var(--blue-soft);color:var(--blue);border-radius:999px}
.qbar{border:0;background:#fff;box-shadow:inset 0 0 0 1.5px var(--edge)}.qbar i{border-radius:999px}
.qword em{color:var(--bad-ink);border-bottom-color:var(--coral)}
.qword .bk{border-color:var(--coral)}
.qhint{border-radius:16px}
.confirm,.note{border-color:#f3e3ad;border-radius:18px}
.chk .mine,.chk .right{border-color:var(--edge);border-radius:16px}
.btn.ok.on{background:var(--mint);border-color:var(--mint);color:#fff}.btn.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ring,.ring div{border:0}.ring{box-shadow:var(--soft)}
.rv .a s{color:var(--bad-ink)}.rv .a b{color:var(--mint-ink)}
.rv img{border-color:var(--edge);border-radius:12px}
.tag.red{color:var(--bad-ink)}
.pages img{border:1.5px solid var(--edge);border-radius:8px;max-width:100%}

.chip.on::before{content:"✓";margin-right:6px;font-weight:700}
.chip:not(.on){color:var(--ink2)}

/* 生字關卡 */
.t5{background:#efe9ff}
.radq{border-top:1.5px dashed var(--edge);padding-top:14px}
.radopts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.opt.rad{font-family:var(--kai);font-size:32px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;gap:2px}
.opt.rad small{font-family:var(--body);font-size:13px;opacity:.75}
.lesson .pass,.pass{color:var(--mint-ink);font-weight:700}
.radres{font-weight:700;font-size:15px;text-align:center;border-radius:12px;padding:4px 8px}
.radres.ok{background:var(--mint-soft);color:var(--mint-ink)}.radres.no{background:var(--coral-soft);color:var(--bad-ink)}
.trialcard p{max-width:62ch}
@media (max-width:760px){.radopts{grid-template-columns:repeat(2,1fr)}}

.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--sun-soft);border-radius:18px;padding:10px 14px;margin-bottom:14px}
.quick>span{font-size:14px;font-weight:700;color:var(--ink2);margin-right:4px}

/* 字卡手寫 */
.cardrow{display:grid;grid-template-columns:1fr auto;gap:16px;margin-top:14px;align-items:stretch}
.cardrow .flash{min-height:0}
.practice{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.practice .pad{width:min(300px,70vw)}
.ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--kai);font-size:min(230px,54vw);line-height:1;color:rgba(111,130,238,.18);pointer-events:none}
@media (max-width:760px){.cardrow{grid-template-columns:1fr}}

.back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:4px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--edge);color:var(--ink);font-weight:700;text-decoration:none;box-shadow:0 2px 0 rgba(123,110,170,.1);font-size:15px}

</style>
</head>
<body>
<div id="shell">
  <header class="top" id="top"></header>
  <main id="app"></main>
  <nav class="tabs" id="tabs" aria-label="主選單"></nav>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

function setRW(c,w,z){known.add(w);const k=c+'|'+w;if(!(k in RW))RW[k]=z;}

function radOpts(o){const ans=o.r,ok=x=>x!==ans&&RADS.includes(x);

    common=shuffle(['人','口','手','水','心','木','艸','言','火','土','糸','金','女','日','月','目','石','竹','衣','貝']).filter(ok);

const toneVars=z=>{const b=z.replace(/[˙ˊˇˋ]/g,'');return [b,b+'ˊ',b+'ˇ',b+'ˋ'].filter(x=>x!==z);};
function itemIdFor(c,w){if(charBy[c])return 'c:'+c;if(w&&wordBy[w])return 'w:'+w;return null;}
function lessonFor(c,w){if(charBy[c])return charBy[c].l;if(wordBy[w])return wordBy[w].l;const gs=groupsOf[c];return gs?GR[gs[0]].l:0;}
function subOK(word,from,to){return !known.has(word.split(from).join(to))&&!BL.has(word+'|'+to);}
function charInfo(ch,w){
  const c=charBy[ch];let s='';
  if(c){s='<b class="kai">'+c.c+'</b> '+c.z+'（'+c.r+'部）'+(c.w.length?'：'+c.w.join('、'):'');
    (c.alt||[]).forEach(a=>{s+='<br>又讀 '+a.z+'：'+a.w.join('、');});if(c.note)s+='<br>'+esc(c.note);}
  else{s='<b class="kai">'+ch+'</b> '+(RW[ch+'|'+w]||'')+(w?'：'+w:'');}
  const gs=groupsOf[ch];
  if(gs){const g=GR[gs[0]];s+='<br>形近字：'+g.items.filter(it=>it.c!==ch).map(it=>'<b class="kai">'+it.c+'</b> '+it.z+'（'+it.w.join('、')+'）').join('　');}
  if(w&&wordBy[w])s+='<br>'+esc(w)+'：'+esc(wordBy[w].d);
  return s;}
function wordInfo(w){const o=wordBy[w];return '<b class="kai">'+esc(o.w)+'</b> '+o.z+'<br>'+esc(o.d)+'<br>例句：'+esc(o.s);}
function pickWords(word,n,extraBad){
  const o=wordBy[word],bad=synOf(word),idiom=o.w.length>=4;
  const ok=x=>x.w!==word&&!bad.has(x.w)&&(x.w.length>=4)===idiom&&!(extraBad&&extraBad(x));
  const same=shuffle(WD.filter(x=>x.l===o.l&&ok(x))),other=shuffle(WD.filter(x=>x.l!==o.l&&ok(x)));
  return same.concat(other).slice(0,n);}
function makeQ(key){
  const p=key.split('|'),t=p[0];
  if(t==='k'){const c=p[1],w=p[2],o=charBy[c];if(!o||!w||!w.includes(c))return null;const z=RW[c+'|'+w]||(w===c?o.z:null);if(!z)return null;
    return {key,t,l:o.l,id:'c:'+c,c,w,z,kind:'hw',ans:c,rad:o.r,ropts:radOpts(o),exp:charInfo(c,w)};}
  if(t==='r'||t==='c'||t==='w'){
    const c=p[1],w=p[2],z=RW[c+'|'+w];if(!z||!w.includes(c))return null;
    const base={key,t,l:lessonFor(c,w),id:itemIdFor(c,w),c,w,z,exp:charInfo(c,w)};
    if(t==='r'){
      let ds=[];readingsOf(c).forEach(x=>ds.push(x));
      (groupsOf[c]||[]).forEach(gi=>GR[gi].items.forEach(it=>{if(it.c!==c)ds.push(it.z);}));
      ds=uniq(ds.concat(shuffle(toneVars(z)))).filter(x=>x!==z).slice(0,3);
      return Object.assign(base,{kind:'mc',ans:z,opts:shuffle([z].concat(ds)),cls:''});}
    if(t==='w')return Object.assign(base,{kind:'hw',ans:c});
    let ds=[];(groupsOf[c]||[]).forEach(gi=>GR[gi].items.forEach(it=>{if(it.c!==c&&subOK(w,c,it.c))ds.push(it.c);}));
    ds=shuffle(uniq(ds));
    const pool=shuffle(CH.filter(x=>x.l===base.l&&x.c!==c&&x.z!==z&&!(x.alt||[]).some(a=>a.z===z)&&subOK(w,c,x.c)).map(x=>x.c));
    ds=uniq(ds.concat(pool)).slice(0,3);
    return Object.assign(base,{kind:'mc',ans:c,opts:shuffle([c].concat(ds)),cls:'han'});}
  if(t==='g'){
    const g=GR[+p[1]];if(!g)return null;const it=g.items[+p[2]],w=p[3];if(!it||!it.w.includes(w))return null;
    const opts=uniq(g.items.map(x=>x.c));
    return {key,t,l:g.l,id:itemIdFor(it.c,w),c:it.c,w,kind:'mc',ans:it.c,opts:shuffle(opts),cls:'han',
      exp:g.items.map(x=>'<b class="kai">'+x.c+'</b> '+x.z+'：'+x.w.join('、')).join('<br>')};}
  const o=wordBy[p[1]];if(!o)return null;
  const base={key,t,l:o.l,id:'w:'+o.w,w:o.w,kind:'mc',exp:wordInfo(o.w)};
  if(t==='d'){const ds=pickWords(o.w,3).map(x=>x.d);return Object.assign(base,{ans:o.d,opts:shuffle([o.d].concat(ds)),cls:'txt'});}
  if(t==='e'){const ds=pickWords(o.w,3).map(x=>x.w);return Object.assign(base,{ans:o.w,opts:shuffle([o.w].concat(ds)),cls:'wd',def:o.d.split(o.w).join('～')});}
  if(t==='f'){const ds=pickWords(o.w,3,x=>o.s.includes(x.w)||o.w.includes(x.w)||x.w.includes(o.w)).map(x=>x.w);return Object.assign(base,{ans:o.w,opts:shuffle([o.w].concat(ds)),cls:'wd',sent:o.s});}
  return null;}
function seedsFor(lessons){
  const L=new Set(lessons),out={r:[],c:[],w:[],g:[],d:[],e:[],f:[]};
  CH.forEach(c=>{if(!L.has(c.l)||!c.w.length)return;
    if(!c.noread){out.r.push('r|'+c.c+'|'+rnd(once(c.w,c.c)));(c.alt||[]).forEach(a=>out.r.push('r|'+c.c+'|'+rnd(once(a.w,c.c))));}
    const all=once(allWordsOf(c),c.c);out.c.push('c|'+c.c+'|'+rnd(all));out.w.push('w|'+c.c+'|'+rnd(all));});
  WD.forEach(w=>{if(!L.has(w.l))return;['d','e','f'].forEach(t=>out[t].push(t+'|'+w.w));if(TRICKY[w.w])out.r.push('r|'+TRICKY[w.w]+'|'+w.w);});
  GR.forEach((g,gi)=>{if(g.t!=='near'||!L.has(g.l))return;g.items.forEach((it,ci)=>{
    const ws=it.w.filter(w=>g.items.every(o=>o.c===it.c||subOK(w,it.c,o.c)));if(ws.length)out.g.push('g|'+gi+'|'+ci+'|'+rnd(ws));});});
  return out;}
const prio=id=>{const s=id&&S.item[id];return (!s?0.6:s[2]===1?2:0)+Math.random()*1.2;};
function buildSession(lessons,alloc){
  const seeds=seedsFor(lessons),used=new Set(),qs=[];
  const take=(t,n)=>{let got=0;const list=seeds[t].map(k=>{const p=k.split('|');const id=t==='g'?'c:'+GR[+p[1]].items[+p[2]].c:(t==='d'||t==='e'||t==='f')?'w:'+p[1]:'c:'+p[1];return {k,id,g:t==='g'?'g'+p[1]:null,s:prio(t==='g'?null:id)};}).sort((a,b)=>a.s-b.s);
    for(const x of list){if(got>=n)break;if(used.has(x.id)||(x.g&&used.has(x.g)))continue;const q=makeQ(x.k);if(!q||(q.kind==='mc'&&q.opts.length<2))continue;used.add(x.id);if(x.g)used.add(x.g);qs.push(q);got++;}return got;};

const PW=1123,PH=794,MR=44,ML=44,MT=44,MB=52,PK=2;

class VPaper{
  constructor(){this.pages=[];this.newPage();}
  newPage(){const c=document.createElement('canvas');c.width=PW*PK;c.height=PH*PK;const x=c.getContext('2d');x.scale(PK,PK);x.fillStyle='#fff';x.fillRect(0,0,PW,PH);x.fillStyle='#000';x.strokeStyle='#000';x.textBaseline='middle';x.textAlign='center';this.x=x;this.left=PW-MR;this.y=MT;this.pages.push(c);}

    else if(ch==='＿'){x.lineWidth=1;x.beginPath();x.moveTo(cx+sz*0.45,y);x.lineTo(cx+sz*0.45,y+sz*1.12);x.stroke();}
    else x.fillText(ch,cx,cy);}
  num(tk,cx,y,sz){const x=this.x,f=x.font;x.font=Math.round(sz*0.62)+'px '+PF;x.fillText(tk,cx,y+sz*0.45);x.font=f;}
  zyH(z,sz){return (z.replace(/[˙ˊˇˋ]/g,'').length+(z[0]==='˙'?0.6:0))*sz*0.62+sz*0.2;}
  zy(z,cx,y,sz){const x=this.x,f=x.font,s=sz*0.62,syms=Array.from(z.replace(/[˙ˊˇˋ]/g,'')),tone=(z.match(/[ˊˇˋ]/)||[''])[0];x.font=s+'px '+PF;let yy=y+sz*0.1;
    if(z[0]==='˙'){x.fillText('˙',cx,yy+s*0.45);yy+=s*0.6;}
    syms.forEach((c,i)=>x.fillText(c,cx,yy+s*(i+0.5)));if(tone)x.fillText(tone,cx+s*0.82,yy+s*(syms.length-0.3));x.font=f;}
